name: ci
on: [push, pull_request]
jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - run: npm install
      - run: python -m pip install -r requirements.txt
      - run: npx playwright-core install chromium
      - run: node bin/ucr.mjs doctor
      - name: render de fumaça (sem voz, trilha sintética)
        run: node bin/ucr.mjs tudo exemplos/smoke
      - name: confere que o MP4 saiu
        shell: bash
        run: test -s exemplos/smoke/saida/smoke.mp4
